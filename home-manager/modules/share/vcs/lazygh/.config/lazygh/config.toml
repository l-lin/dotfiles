[display]
repository_style = "name"

[story_review]
agent_command = [
  "pi",
  "--model", "github-copilot/gpt-5.6-luna",
  "--no-session",
  "--no-context-files",
  "--no-skills",
  "--no-extensions",
  "--thinking", "off",
  "--system-prompt", "''",
  "--append-system-prompt", "''",
  "-p", "@{{prompt_file}}",
]

[keymaps.global]
open_actions_popup = "alt+a"

[keymaps.actions_popup]
submit_selected_picker = ["alt+enter", "ctrl+s"]

[keymaps.pull_requests]
comment_on_pull_request = "alt+c"

[theme]
preset = "grey"
